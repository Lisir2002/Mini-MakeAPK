[versions]
agp = "8.5.2"
kotlin = "1.9.24"
composeCompiler = "1.5.14"
composeBom = "2024.09.00"
paparazzi = "1.3.4"
robolectric = "4.12.2"
# androidx.test：Room MigrationTestHelper 在 Robolectric 下需要 ApplicationProvider / InstrumentationRegistry。
# 版本红线：与 Robolectric 4.12.x 配套的 test core 1.5.0 / runner 1.5.2；再新版本要求更高 compileSdk，需同步升 AGP。
androidxTestCore = "1.5.0"
androidxTestRunner = "1.5.2"
androidxTestRules = "1.5.0"
# Espresso：Compose UI 测试（ui-test-android 的 EspressoLink）在**单元测试**里也需要它在 classpath 上。
# 版本红线：3.5.1 与 androidx.test 1.5.x / Robolectric 4.12.x 配套，再高会要求更高 compileSdk。
androidxTestEspresso = "3.5.1"
# Hamcrest：junit 传递的 hamcrest-core 1.3 与 espresso 依赖的 hamcrest 2.2 抢
# org.hamcrest.core.AllOf（方法签名不同，运行期会 NoSuchMethodError）。2.2 是 1.3 的超集。
hamcrest = "2.2"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.4"
activityCompose = "1.9.2"
junit = "4.13.2"

# ── 数据层 ──────────────────────────────────────────────────────────
# Room 2.6.1：与 Kotlin 1.9.24 / KSP 1.9.24-1.0.20 对齐（升级需同步 KSP 版本）
room = "2.6.1"
# SQLCipher for Android：自带 SupportOpenHelperFactory，直连 androidx.sqlite.db（Room 2.x）
# 版本上限注意（双重约束，实测）：
#   1) 4.18.0+ 的 AAR 要求 compileSdk ≥ 37，本项目 compileSdk 34 / AGP 8.5.2。
#   2) 4.14.1+ 传递依赖 androidx.sqlite 2.6.2（Kotlin 2.1 元数据），
#      与本项目 Kotlin 1.9.24 编译器不兼容。4.13.0 传递的是 androidx.sqlite 2.2.0，安全。
# 升级 SQLCipher 前必须同步升级 AGP + compileSdk + Kotlin/KSP，并回归 Paparazzi 截图基线。
sqlcipher = "4.13.0"
# 安全存储：SQLCipher 口令经 Android Keystore 加密后落盘（不落明文）
securityCrypto = "1.0.0"
# Paging3：构建历史长列表分页加载
paging = "3.3.0"
# 页面骨架：Navigation Compose + ViewModel/生命周期的 Compose 桥接
# 版本红线：这些版本 metadata 为 1.8.0（Kotlin 1.9 可读）；
# navigation 2.9+ / lifecycle 2.9+ 由 Kotlin 2.x 编译，会触发
# "metadata is 2.x, expected 1.9.0"，升级必须与 Kotlin/KSP/Room/AGP 整体同步。
navigationCompose = "2.8.9"
lifecycleCompose = "2.8.4"
# 协程：Room suspend / Flow 必需
coroutines = "1.7.3"
# KSP：必须与 kotlin 版本严格匹配（1.9.24 → 1.9.24-1.0.20）
ksp = "1.9.24-1.0.20"
# JSON 序列化：WebRuntimeConfig 与导出模板壳共用资产（本地注入架构）。
# 版本红线：须与 Kotlin 1.9.24 兼容——1.8.x 需 Kotlin 1.9.0+，1.8.0+ 起需 Kotlin 2.0，故锁 1.6.x。
kotlinxSerialization = "1.6.3"
# 磨砂玻璃：跨子树真模糊（Modifier.blur 只能模糊自身子树，跨节点需 Haze 的
# hazeSource/hazeChild 捕获）。版本红线：0.7.3 是最后一个用 Kotlin 1.9.24
# 编译的稳定版（CMP 1.6.11）；1.0.0+ 起 Kotlin 2.x 元数据，本项目 Kotlin
# 1.9.24 编译器读不了，升级须随 Kotlin 整体演进。
haze = "0.7.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# 交互回归测试（点击路径）：compose-rule 在 Robolectric 上跑，无需模拟器。
# 版本由 composeBom 统一管理（2024.09.00 → 1.7.0，与 foundation/material3 同批，Kotlin 1.9 元数据可读）。
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
paparazzi = { group = "app.cash.paparazzi", name = "paparazzi", version.ref = "paparazzi" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }

# ── 数据层依赖 ──────────────────────────────────────────────────────
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
# paging-compose：Compose 侧 collectAsLazyPagingItems / LazyPagingItems（日志全量历史分页）
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
# 加密 SQLite 引擎（提供 androidx.sqlite.db.SupportSQLiteOpenHelper.Factory 实现）
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# 单测专用：runTest / Dispatchers.setMain（ViewModel 单测需要主线程调度器）
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# 统一内核契约：Project 去 DB 字段后的可 JSON 序列化体（WebRuntimeConfig）与其导出壳共用
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── 磨砂玻璃（Haze）────────────────────────────────────────────────
# haze：核心 hazeSource/hazeChild；haze-materials：预置材质（thin/regular/thick）
# 注意：旧坐标 haze-jetpack-compose 止于 0.7.0，已废弃；CMP 传递的 androidx
# compose 1.6.8 由 BOM 2024.09.00 抬至 1.7.x（版本仲裁选高，API 兼容）。
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# kotlinx.serialization 编译器插件（版本须与 kotlin 严格一致 = 1.9.24）
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
