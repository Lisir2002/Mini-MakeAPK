name: Verify

# 每次 PR / 推送执行验证：单元测试 + 截图回归比对。
# 本地同样只做验证（docs/VERSIONING.md §4），此工作流是同一套闸门的 CI 版本。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: 测试 + 截图回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管 runner 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk，许可已接受），
      # 无需 android-actions/setup-android——该 action 内部执行 sdkmanager tools，
      # 而遗留 tools 包已从 SDK 仓库移除，会直接失败（2026-10-24 实测）。
      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || true

      # 设计令牌门禁（严格模式：ui/ 下出现色值/圆角/间距/字号字面量即失败）。
      # 规约见 scripts/gitops/check_token_usage.py 文档串与 docs/ARCHITECTURE.md 令牌链路；
      # 确有必要的例外用行内豁免 `// token-gate: allow <理由>`（见 docs/CODE_STYLE.md）。
      - name: 设计令牌门禁（严格）
        run: python3 scripts/gitops/check_token_usage.py --strict

      - name: 运行单元测试（含数据层逻辑）
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 截图回归比对（与已提交基线逐像素比较）
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - name: 上传测试与截图报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/test-results
