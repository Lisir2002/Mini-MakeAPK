name: Release

# 成品（APK）**只在 GitHub 上产出**：推送 v* tag 时构建并发布 Release。
# 本地不做编译成品（见 docs/VERSIONING.md §5）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ① 强制校验：tag 必须与 app/build.gradle.kts 中的版本严格一致
  validate-version:
    name: 校验 tag 与版本一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提取版本并比对 tag
        run: |
          set -euo pipefail
          # 版本号 = 纯四段式（可带 -rcN 后缀），tag = v<versionName>，不带 +N
          # versionCode 仅 build.gradle.kts 内部单增，不参与 tag（2026-10-25 起，见 docs/VERSIONING.md）
          VN=$(grep -oE 'versionName *= *"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?"' app/build.gradle.kts \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?')
          VC=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts \
              | grep -oE '[0-9]+' | head -1)
          EXPECTED="v${VN}"
          echo "versionName=${VN}  versionCode=${VC}（versionCode 仅内部单增，不进 tag）"
          echo "期望 tag = ${EXPECTED}"
          echo "实际 tag = ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::tag 与版本不一致：应为 ${EXPECTED}，实为 ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "expected_tag=${EXPECTED}" >> "$GITHUB_OUTPUT"

  # ② 构建成品并发布
  release:
    name: 构建并发布 APK
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管 runner 自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk，许可已接受），
      # 无需 android-actions/setup-android——该 action 内部执行 sdkmanager tools，
      # 而遗留 tools 包已从 SDK 仓库移除，会直接失败（2026-10-24 实测）。
      - name: 确认 Android SDK 环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || true

      # 出成品前先过同一套验证闸门，失败则不发布
      - name: 验证闸门（测试 + 截图回归）
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --no-daemon

      # 签名密钥经 GitHub Secret 注入（base64 编码的 .jks）；未配置则产出未签名 APK。
      # 密钥与口令只在内存/临时目录中出现，不落仓库、日志中自动脱敏。
      - name: 配置 Release 签名（若已设置密钥 Secret）
        env:
          MMA_KEYSTORE_BASE64: ${{ secrets.MMA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MMA_KEYSTORE_BASE64}" ]; then
            echo "::notice::未配置 MMA_KEYSTORE_BASE64，产出未签名 APK（自分发/内测）"
            exit 0
          fi
          KS="$RUNNER_TEMP/mma-release.jks"
          echo "${MMA_KEYSTORE_BASE64}" | base64 -d > "$KS"
          {
            echo "MMA_KEYSTORE_FILE=${KS}"
            echo "MMA_KEYSTORE_PASSWORD=${{ secrets.MMA_KEYSTORE_PASSWORD }}"
            echo "MMA_KEY_ALIAS=${{ secrets.MMA_KEY_ALIAS }}"
            echo "MMA_KEY_PASSWORD=${{ secrets.MMA_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "签名密钥已注入（路径与口令均不在日志中展示）"

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 整理产物（以 tag 命名）
        run: |
          set -euo pipefail
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "out/MMA-${GITHUB_REF_NAME}.apk"
          done
          ls -la out

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          name: "MMA ${{ github.ref_name }}"
          files: out/*.apk
          generate_release_notes: true
